<script>
(() => {
// ------------------------------------------------------------ procedural textures
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function cvs(n = 1024) { const c = document.createElement('canvas'); c.width = c.height = n; return [c, c.getContext('2d')]; }
function noise(ctx, n, amt, seed, mono = true) {
  const r = rng(seed), id = ctx.getImageData(0, 0, n, n), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = (r() - .5) * amt; d[i] += v; d[i + 1] += mono ? v : (r() - .5) * amt; d[i + 2] += mono ? v : (r() - .5) * amt; }
  ctx.putImageData(id, 0, 0);
}
function veins(ctx, n, color, count, width, alpha, seed, blur = 2) {
  const r = rng(seed); ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let k = 0; k < count; k++) {
    let x = r() * n, y = -40, ang = Math.PI / 2 + (r() - .5) * 1.4; const w = width * (0.3 + r());
    ctx.globalAlpha = alpha * (0.35 + r() * .65); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y);
    while (y < n + 40 && x > -80 && x < n + 80) { ang += (r() - .5) * .5; x += Math.cos(ang) * 14; y += Math.abs(Math.sin(ang)) * 14 + 2; ctx.lineTo(x, y); }
    ctx.stroke();

}
function marble(base, vein, seed, opts = {}) {

  veins(x, n, vein, opts.soft || 10, 26, .18, seed, 10);
  veins(x, n, vein, opts.count || 14, 4, opts.alpha || .7, seed + 7, 1.2);

}
function terrazzo(base, chips, seed) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = base; x.fillRect(0, 0, n, n); noise(x, n, 10, seed);
  for (let i = 0; i < 1400; i++) {
    const cx = r() * n, cy = r() * n, s = 3 + Math.pow(r(), 2.5) * 30; x.fillStyle = chips[(r() * chips.length) | 0];
    x.beginPath(); const k = 5 + (r() * 4 | 0);

}
function concrete(base, seed) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = base; x.fillRect(0, 0, n, n);
  x.filter = 'blur(30px)'; for (let i = 0; i < 40; i++) { x.globalAlpha = .06; x.fillStyle = r() < .5 ? '#000' : '#fff'; x.beginPath(); x.arc(r() * n, r() * n, 60 + r() * 160, 0, 7); x.fill(); }
  x.filter = 'none'; x.globalAlpha = 1; noise(x, n, 22, seed);
  for (let i = 0; i < 500; i++) { x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(r() * n, r() * n, 1.5, 1.5); }
  return c;
}
function travertine(base, band, seed) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = base; x.fillRect(0, 0, n, n);
  x.filter = 'blur(14px)';
  for (let i = 0; i < 40; i++) { x.globalAlpha = .07; x.fillStyle = r() < .5 ? band : '#f3e6cf'; x.beginPath(); x.ellipse(r() * n, r() * n, 80 + r() * 200, 30 + r() * 70, 0, 0, 7); x.fill(); }
  for (let i = 0; i < 6; i++) { const y = r() * n, h = 6 + r() * 20; x.globalAlpha = .05 + r() * .06; x.fillStyle = r() < .6 ? band : '#fff8ec';
    x.beginPath(); x.moveTo(0, y); for (let px = 0; px <= n; px += 32) x.lineTo(px, y + Math.sin(px * .01 + i) * 4 + (r() - .5) * 2); x.lineTo(n, y + h); x.lineTo(0, y + h); x.fill(); }
  x.filter = 'none'; x.globalAlpha = .45; x.fillStyle = '#8a7356';
  for (let i = 0; i < 260; i++) { x.beginPath(); x.ellipse(r() * n, r() * n, 2 + r() * 12, 1 + r() * 3, 0, 0, 7); x.fill(); }

}
function timber(base, dark, seed, vertical = true) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = base; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 220; i++) { let p = r() * n; x.strokeStyle = dark; x.globalAlpha = .05 + r() * .18; x.lineWidth = .6 + r() * 2.5; x.beginPath();
    for (let t = 0; t <= n; t += 16) { const off = Math.sin(t * .006 + i) * 6 + Math.sin(t * .03 + i * 3) * 1.5; vertical ? x.lineTo(p + off, t) : x.lineTo(t, p + off); } x.stroke(); }
  x.globalAlpha = 1; noise(x, n, 10, seed); return c;
}
function grass(base, seed, light = false) {
  const n = 512, [c, x] = cvs(n), r = rng(seed); x.fillStyle = base; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 9000; i++) { const px = r() * n, py = r() * n, l = 4 + r() * 9, hue = 85 + r() * 30, li = (light ? 32 : 22) + r() * 18;
    x.strokeStyle = `hsl(${hue},${45 + r() * 20}%,${li}%)`; x.lineWidth = 1.3; x.beginPath(); x.moveTo(px, py); x.lineTo(px + (r() - .5) * 4, py - l); x.stroke(); }
  return c;
}
function pavers(base, joint, seed) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = joint; x.fillRect(0, 0, n, n);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { x.fillStyle = base; x.fillRect(i * 512 + 3, j * 512 + 3, 506, 506);
    x.globalAlpha = .05; for (let k = 0; k < 30; k++) { x.fillStyle = r() < .5 ? '#000' : '#fff'; x.fillRect(i * 512 + r() * 500, j * 512 + r() * 500, 40, 40); } x.globalAlpha = 1; }

function tiles(base, joint, cols, rows, seed, vary = 0) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = joint; x.fillRect(0, 0, n, n);
  const tw = n / cols, th = n / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols + 1; i++) { const off = (j % 2) * tw / 2;
    const l = vary ? (r() - .5) * vary : 0; x.fillStyle = base; x.filter = vary ? `brightness(${1 + l})` : 'none';
    x.fillRect(i * tw - off + 2, j * th + 2, tw - 4, th - 4); }

}
function render(base, seed) { const n = 512, [c, x] = cvs(n); x.fillStyle = base; x.fillRect(0, 0, n, n); noise(x, n, 14, seed); return c; }
function membrane(seed) {
  const n = 1024, [c, x] = cvs(n), r = rng(seed); x.fillStyle = '#c9b48d'; x.fillRect(0, 0, n, n);
  x.filter = 'blur(26px)'; for (let i = 0; i < 26; i++) { x.globalAlpha = .12 + r() * .12; x.fillStyle = '#4f4636'; x.beginPath(); x.ellipse(r() * n, r() * n, 40 + r() * 140, 20 + r() * 60, r() * 3, 0, 7); x.fill(); }
  x.filter = 'none'; x.globalAlpha = 1; noise(x, n, 30, seed); return c;
}

// ------------------------------------------------------------ finish options
const STONE = [
  { id: 'calacatta', name: 'Calacatta-look white', desc: 'White with grey veining', canvas: () => marble('#f2f0eb', '#9e978b', 11), rough: .28 },
  { id: 'travertine', name: 'Travertine-look', desc: 'Warm honed beige', canvas: () => travertine('#d9c6a6', '#b79c74', 21), rough: .6 },
  { id: 'concrete', name: 'Concrete-look', desc: 'Mid grey, matte', canvas: () => concrete('#a6a49f', 31), rough: .75 },
  { id: 'terrazzo', name: 'Terrazzo-look', desc: 'Warm white with mixed chips', canvas: () => terrazzo('#ece6dc', ['#b98a6a', '#7f8a83', '#d7c3a5', '#4d4a46', '#c9b8a4'], 41), rough: .45 },
  { id: 'nero', name: 'Nero marble-look', desc: 'Black with white veining', canvas: () => marble('#1d1d1e', '#d9d6cf', 51, { count: 10, alpha: .55 }), rough: .3 },
  { id: 'verde', name: 'Verde quartzite-look', desc: 'Green with pale veining', canvas: () => marble('#4e6a5c', '#c9d6cb', 61, { count: 18, alpha: .45, soft: 16 }), rough: .32 },
];
const JOINERY = [

  { id: 'sage', name: 'Sage', hex: '#8f9c87' }, { id: 'forest', name: 'Deep green', hex: '#2f4a3f' },
  { id: 'navy', name: 'Navy', hex: '#27313f' }, { id: 'charcoal', name: 'Charcoal', hex: '#333538' },
  { id: 'oak', name: 'Light oak (compact laminate)', hex: '#c9a678', canvas: () => timber('#c9a678', '#7d5a34', 71) },
  { id: 'walnut', name: 'Walnut (compact laminate)', hex: '#6b4a33', canvas: () => timber('#6e4c34', '#2e1d12', 81) },
];
const CLAD = [

  { id: 'stone', name: 'Stone-clad, matches top' }, { id: 'flat', name: 'Flat, joinery colour' },

  { id: 'brass', name: 'Brushed brass', hex: '#c09a55', rough: .32 },
  { id: 'black', name: 'Matte black', hex: '#1b1b1c', rough: .55 },

  { id: 'white', name: 'White gloss tile, brick lay', canvas: () => tiles('#f4f3ef', '#cfccc4', 6, 18, 91), swatch: '#f4f3ef' },
  { id: 'zellige', name: 'Green handmade tile', canvas: () => tiles('#5f8a74', '#d8d3c8', 8, 8, 93, .35), swatch: '#5f8a74' },

  { name: 'Terrazzo & oak', s: { stone: 'terrazzo', joinery: 'oak', clad: 'stone', hardware: 'brass', splash: 'clay', floor: 'turflight', walls: 'greige', pendant: 'rattan', stools: 'white' } },
];

  { key: 'stone', title: 'Stone (bar tops & waterfall ends)', code: 'ST-01', list: STONE, kind: 'tex' },
  { key: 'joinery', title: 'Joinery colour (doors, panels)', code: 'JN-02', list: JOINERY, kind: 'color' },

// texture cache
const texCache = {};
function tex(key, makeCanvas) {

  [pend.dome, pend.rattan, pend.glass].forEach(g => { const cord = new THREE.Mesh(new THREE.CylinderGeometry(.004, .004, 2.45 - PY), M.dark); cord.position.set(x, PY + (2.45 - PY) / 2, PZ); g.add(cord); });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.14, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.shade); dome.position.set(x, PY - .14, PZ); dome.castShadow = true; pend.dome.add(dome);
  const rat = new THREE.Mesh(new THREE.SphereGeometry(.19, 18, 10, 0, Math.PI * 2, 0, Math.PI * .62), M.rattan); rat.position.set(x, PY - .2, PZ); rat.castShadow = true; pend.rattan.add(rat);
  const glob = new THREE.Mesh(new THREE.SphereGeometry(.12, 32, 16), M.opal); glob.position.set(x, PY - .15, PZ); pend.glass.add(glob);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.035, 16, 8), M.bulb); bulb.position.set(x, PY - .1, PZ); pend.dome.add(bulb); pend.rattan.add(bulb.clone());
  const pl = new THREE.PointLight(0xffc98a, 0, 4.5, 2); pl.position.set(x, PY - .2, PZ); root.add(pl); pendLights.push(pl);
});

// lights
const hemi = new THREE.HemisphereLight(0xdfe8f0, 0x8a7a60, .55); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 40 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = .02;
scene.add(sun); scene.add(sun.target); sun.target.position.set(1.4, 0, 2);
const ledLights = [.35, 1.05, 1.75, 2.45].map(x => { const l = new THREE.PointLight(0xffd9a0, 0, 1.6, 2); l.position.set(x, OHU - .06, .32); BB.add(l); return l; });
const bunkerLight = new THREE.PointLight(0xffe0b0, 0, 4, 2); bunkerLight.position.set(4.2, 1.9, .3); root.add(bunkerLight);
const fridgeLights = [];

function skyTexture(top, bottom) { const [c, x] = cvs(256); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, top); g.addColorStop(1, bottom); x.fillStyle = g; x.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
const SKIES = { day: skyTexture('#9fb9cf', '#e7ecee'), golden: skyTexture('#8fa2bd', '#f2c48e'), evening: skyTexture('#0e1626', '#3a3550') };
function applyLight() {
  const m = lightMode;
  scene.background = SKIES[m];
  if (m === 'day') { sun.color.set(0xfff4e2); sun.intensity = 2.4; sun.position.set(7, 7, 10); hemi.intensity = .32; hemi.color.set(0xdfe8f0); renderer.toneMappingExposure = .9; }
  if (m === 'golden') { sun.color.set(0xffb070); sun.intensity = 2.6; sun.position.set(9, 2.6, 7); hemi.intensity = .25; hemi.color.set(0xf0d3b5); renderer.toneMappingExposure = .9; }
  if (m === 'evening') { sun.intensity = 0; hemi.intensity = .07; hemi.color.set(0x6f7fa8); renderer.toneMappingExposure = 1.15; }
  const eve = m === 'evening', gold = m === 'golden';
  M.led.emissive.set(eve || gold ? 0xffd9a0 : 0x000000); M.led.emissiveIntensity = eve ? 3 : 1.2;
  ledLights.forEach(l => l.intensity = eve ? .9 : gold ? .25 : 0);
  M.fridgeIn.emissive.set(eve ? 0x6a8db0 : 0x10161c);
  const pOn = state.pendant !== 'none';
  pendLights.forEach(l => l.intensity = pOn ? (eve ? .8 : gold ? .3 : 0) : 0);
  M.bulb.emissive.set(eve || gold ? 0xffd39a : 0x222222); M.bulb.emissiveIntensity = 2;
  M.opal.emissive.set(eve ? 0xffe2b8 : gold ? 0x6b5a45 : 0x000000);
  bunkerLight.intensity = 0;
  scene.traverse(o => { if (o.isMesh && o.material && o.material.envMapIntensity !== undefined) o.material.envMapIntensity = (o.material.metalness > .5 ? 1 : .22) * (eve ? .25 : gold ? .7 : 1); });
  document.querySelectorAll('[data-light]').forEach(b => b.setAttribute('aria-pressed', b.dataset.light === m));
}

// apply finishes
function applyFinishes() {
  const s = find(STONE, state.stone); M.stone.map = tex('stone' + s.id, s.canvas); M.stone.color.set(0xffffff); M.stone.roughness = s.rough; M.stone.needsUpdate = true;
  const j = find(JOINERY, state.joinery);
  if (j.canvas) { M.joinery.map = tex('joinery' + j.id, j.canvas); M.joinery.color.set(0xffffff); M.joinery.roughness = .6; }
  else { M.joinery.map = null; M.joinery.color.set(j.hex); M.joinery.roughness = .72; }
  M.joinery.needsUpdate = true;
  M.carcass.map = M.joinery.map; M.carcass.color.copy(M.joinery.color); M.carcass.roughness = M.joinery.roughness; M.carcass.needsUpdate = true;
  Object.entries(clad).forEach(([k, g]) => g.visible = k === state.clad);
  const h = find(HARDWARE, state.hardware); M.hw.color.set(h.hex); M.hw.roughness = h.rough; M.hw.metalness = state.hardware === 'black' ? .4 : 1; M.shade.color.set(h.hex); M.shade.metalness = M.hw.metalness; M.shade.roughness = .45;
  const sp = find(SPLASH, state.splash);
  if (sp.id === 'match') { M.splash.map = M.stone.map; M.splash.color.set(0xffffff); M.splash.roughness = s.rough; }
  else if (sp.id === 'render') { M.splash.map = tex('wallr', () => render('#ffffff', 121)); M.splash.color.set(find(WALLS, state.walls).hex); M.splash.roughness = .95; }
  else { const t = tex('splash' + sp.id, sp.canvas); t.repeat.set(1, 1); M.splash.map = t; M.splash.color.set(0xffffff); M.splash.roughness = .25; }
  M.splash.needsUpdate = true;
  const f = find(FLOOR, state.floor); const ft = tex('floor' + f.id, f.canvas); ft.repeat.set(f.rep * 1.6, f.rep * 1.4);
  M.floor.map = ft; M.floor.color.set(0xffffff); M.floor.roughness = f.id === 'pavers' ? .7 : .95; M.floor.needsUpdate = true;
  M.wall.map = tex('wallr', () => render('#ffffff', 121)); M.wall.map.repeat.set(4, 2); M.wall.color.set(find(WALLS, state.walls).hex); M.wall.needsUpdate = true;
  Object.entries(pend).forEach(([k, g]) => g.visible = k === state.pendant);
  Object.entries(stoolGroups).forEach(([k, g]) => g.visible = k === state.stools);
}

// camera views
const VIEWS = {
  customer: { p: [2.3, 1.55, 5.6], t: [1.35, 1.0, 1.0] },
  server: { p: [3.9, 1.6, 1.05], t: [1.1, .85, 1.25] },
  wide: { p: [6.2, 2.25, 6.8], t: [1.2, .9, 1.4] },
  detail: { p: [2.55, 1.32, 3.05], t: [2.1, 1.0, 2.25] },
};
let anim = null;
function setView(v, instant) {
  viewMode = v; const V = VIEWS[v];
  const from = { p: camera.position.clone(), t: controls.target.clone() }, to = { p: new THREE.Vector3(...V.p), t: new THREE.Vector3(...V.t) };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (instant || reduce) { camera.position.copy(to.p); controls.target.copy(to.t); anim = null; }
  else anim = { from, to, t0: performance.now(), dur: 900 };
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('[data-light]').forEach(b => b.onclick = () => { lightMode = b.dataset.light; applyLight(); });

function refresh() { applyFinishes(); applyLight(); refreshUI(); }
function applyPreset(i) { presetIdx = i; Object.assign(state, PRESETS[i].s); refresh(); }

function resize() { const w = stage.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
function loop(now) {
  if (anim) { const k = Math.min(1, (now - anim.t0) / anim.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(anim.from.p, anim.to.p, e); controls.target.lerpVectors(anim.from.t, anim.to.t, e); if (k >= 1) anim = null; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
// hooks for still-render capture
window.__finishes = { applyPreset, setView: v => setView(v, true), setLight: m => { lightMode = m; applyLight(); }, set: (k, v) => { state[k] = v; presetIdx = -1; refresh(); } };
setView('customer', true); refresh(); resize(); document.getElementById('loading').remove(); requestAnimationFrame(loop);
})();
</script>
